<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casamento Leticia & Diogo</title>
    
    <style>
      /* Reset e Fonte */
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
      body { background-color: #f4f4f9; color: #333; }

      /* CABEÇALHO VERDE OLIVA */
      .header-banner {
        background-color: #556B2F; /* Verde Oliva */
        color: white;
        padding: 60px 20px;
        text-align: center;
        margin-bottom: 40px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
      .header-banner h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
      .header-banner p { font-size: 1.2rem; opacity: 0.95; }

      /* GRID E LAYOUT */
      .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; min-height: 60vh; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
        padding-bottom: 50px;
      }

      /* CARDS */
      .product-card {
        background: white; border-radius: 12px; padding: 20px;
        border: 1px solid #ddd; text-align: center;
        display: flex; flex-direction: column; align-items: center;
        transition: transform 0.2s;
      }
      .product-card:hover { transform: translateY(-5px); border-color: #556B2F; }
      .product-card img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; }
      .product-card h3 { font-size: 1.2rem; margin-bottom: 8px; color: #333; }
      .product-card p { color: #556B2F; font-weight: bold; font-size: 1.3rem; margin-bottom: 15px; }
      
      /* BOTÕES */
      .product-card button {
        background-color: #556B2F; color: white; border: none; padding: 12px;
        width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer;
      }
      .product-card button:hover { background-color: #3b4d1e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
